defaults:
  - data_paths: default
  - map_config: prebuilt_map
  - params: default
  - _self_
nav:
  valid_range: 1
  vis: False
  visNav: False
  vis2: False
  plann_vis: False
  # When false, match same-category instances across all floors using color only.
  # The selected instance height is still used by the original 3D navigation.
  use_floor_for_matching: True
  use_internal_contour: False
  detect_internal_contours: False
  tasks_per_scene: 20
# scene_id: 4
scene_id: [0]  # Override with the indices of your evaluation scenes
