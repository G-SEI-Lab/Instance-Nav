# Adapted from VLMaps; MIT license: see THIRD_PARTY_LICENSES/VLMaps-LICENSE.
map_type: "vlmap" # Existing prebuilt-map file format.
pose_info:
  pose_type: mobile_base_2 # mobile_base, camera_base
  rot_type: "quat" # "mat", or "quat" (x, y, z, w)
  # if pose_type is camera, the following parameters are ignored
  camera_height: 1.5
  base2cam_rot: [1, 0, 0, 0, -1, 0, 0, 0, -1]
  base_forward_axis: [0, 0, -1]
  base_left_axis: [-1, 0, 0]
  base_up_axis: [0, 1, 0]
skip_frame: 2
#realsense rgb
# cam_calib_mat: [608.1165771484375, 0, 436.9500732421875, 0, 608.1304321289062, 246.06228637695312, 0, 0, 1]

cam_calib_mat: [540, 0, 540, 0, 540, 360, 0, 0, 1]
grid_size: ${params.gs}
cell_size: ${params.cs}
min_height: -0.5
max_height: 3.5
min_floor_height: 0.2
max_floor_height: 1.8
depth_sample_rate: 100
dilate_iter: 1
gaussian_sigma: 1.0
customize_obstacle_map: False
potential_obstacle_names:
  - "chair"
  - "wall"
  - "wall above the door"
  - "table"
  - "window"
  - "floor"
  - "stairs"
  - "door"
  - "counter"
  - "sofa"
  - "curtain"
  - "seating"
  - "bed"
  # - "other"
obstacle_names:
  - "wall"
  - "chair"
  - "table"
  - "seating"
  - "window"
  - "counter"
  - "sofa"
  - "bed"
  # - "other"
passable_names:
  - "floor"
categories: "mp3d" # "mp3d", "ai2thor"
vis: False
